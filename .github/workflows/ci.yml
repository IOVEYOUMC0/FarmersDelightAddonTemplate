# Builds this addon against a freshly built FarmersDelight api jar.
#
# This addon is a Gradle composite build: settings.gradle.kts includes ../FarmersDelight, so building
# it also builds FarmersDelight's :apiJar and stages it into libs/. Nothing is copied by hand -- which
# is the point, five hand-copied stubs are exactly how the api jar used to go stale unnoticed.
#
# So CI only has to put FarmersDelight next to this repository (it also supplies the CraftEngine jars
# referenced as ../FarmersDelight/libs/...); `gradlew build` does the rest, and an api change that
# breaks this addon fails right here.
#
# The FarmersDelight repository is public and is checked out as a sibling; FD_REPO_TOKEN is optional and
# only needed when that checkout is rate limited.
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FDAddonTemplate
        uses: actions/checkout@v4
        with:
          path: FDAddonTemplate

      - name: Checkout FarmersDelight (sibling, provides the api jar + CraftEngine jars)
        uses: actions/checkout@v4
        with:
          repository: IOVEYOUMC0/Farmersdelight-Plugin
          path: FarmersDelight
          token: ${{ secrets.FD_REPO_TOKEN || github.token }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build & test
        working-directory: FDAddonTemplate
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Require zero failing, errored or skipped JUnit tests
        run: python3 FarmersDelight/tools/check_test_results.py FDAddonTemplate

      - name: Set up Python for repository checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run contracts for the checked-out modules
        run: |
          python -m pip install --quiet pyyaml
          python FarmersDelight/tools/run_all_checks.py --quiet

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-FDAddonTemplate
          path: FDAddonTemplate/build/reports/tests/test/
          if-no-files-found: ignore
