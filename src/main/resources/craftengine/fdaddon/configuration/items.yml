
templates:
  fdaddon:food_template:
    material: cooked_beef
    model: ${__NAMESPACE__}:item/${__ID__}

items:
  fdaddon:example_jerky:
    template: fdaddon:food_template
    data:
      item-name: <!i><l10n:item.fdaddon.example_jerky>
      food:
        nutrition: 4
        saturation: 0.8
        can-always-eat: false
    events:
      - on: consume
        functions:
          - type: potion_effect
            potion-effect: minecraft:speed
            duration: 600
            amplifier: 0
            particles: true


recipes:
  fdaddon:example_jerky:
    type: shapeless
    category: misc
    ingredients:
      - "minecraft:cooked_beef"
      - "minecraft:dried_kelp"
    result:
      id: fdaddon:example_jerky
      count: 1
