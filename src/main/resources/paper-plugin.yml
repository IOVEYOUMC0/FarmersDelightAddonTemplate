# Paper plugin manifest. Replaces plugin.yml: a Paper plugin gets its own class loader, so a
# bundled library cannot be silently shared with (or overridden by) another plugin's copy, and
# dependency order is declared per dependency instead of guessed from depend/softdepend.
#
# join-classpath is true wherever this plugin resolves the dependency's classes itself
# (Class.forName, direct imports, or a bundled bridge that does so on its behalf).
# load: POSTWORLD is deliberate (the Paper default): onEnable touches worlds.

name: FDAddonTemplate
version: '${version}'
main: com.example.fdaddon.FDAddonTemplate
api-version: '1.21.4'
folia-supported: true
description: Example addon template for the FarmersDelight (CraftEngine) plugin.
authors:
  - YourName

# Copy this manifest for a new addon: CraftEngine and FarmersDelight are hard dependencies and
# must be on the classpath, everything optional goes below with required: false.
dependencies:
  server:
    CraftEngine:
      load: BEFORE
      required: true
      join-classpath: true
    FarmersDelight:
      load: BEFORE
      required: true
      join-classpath: true
