# Do not edit; this value is maintained by the plugin.
config-version: 1

# Example addon configuration. Edit and run /fd reload all to apply.

# Console-message language, e.g. en_us / zh_cn. Leave it empty to inherit FarmersDelight's resolved server
# locale, so one setting drives every plugin in the family; see lang/en_us.yml for the full resolution order.
language: ''

# First startup extracts this plugin's bundled CraftEngine resources into CraftEngine/resources/<its namespace>.
# With auto-completion true, every later startup also restores files that are missing; set it false to leave an
# existing resource directory exactly as you edited it (the first extraction is unaffected).
# Same name and meaning as FarmersDelight's craftengine-resources setting; each plugin only manages its own
# namespace, so the two settings do not interact.
craftengine-resources:
  auto-completion: true

# Item-id -> duration (in seconds) mappings for FarmersDelight's food effects.
# Comfort: heals 1 HP on an interval while the player's saturation is 0 (slow regen while unsaturated).
# Nourishment: zeroes the player's exhaustion, suppressing hunger drain. (Comfort and Nourishment are
# distinct effects, not weaker/stronger versions of each other.)
# Loaded by ExampleFoodEffectRegistrar; cleared and re-applied on /fd reload.
food-effects:
  comfort:
    - id: "minecraft:golden_apple"
      duration: 600
  nourishment:
    - id: "minecraft:cooked_beef"
      duration: 300
