# Example addon messages: console output plus this template's player feedback. The selected locale follows this
# addon's own language setting, then FarmersDelight's resolved server locale, then CraftEngine's forced
# locale, then the JVM locale, and finally the zh_cn fallback. Edit freely — these ship inside the plugin jar and
# are read fresh on plugin enable (a full restart applies changes). Rename the fdaddon: prefix when forking.
# Values are plain text (AddonLang.get returns a String; MiniMessage tags are only parsed where the caller runs
# them through MiniMessage, as ExampleRecipeType does for the recipe-book titles and buttons).
fdaddon:
  example_used: "Used this block {count} time(s) — saved in the block entity."
  farmersdelight_unavailable: "FarmersDelight not available; addon features disabled."
  api_version: "FarmersDelight api v{version} (station-query={station_query})."
  enabled: "FDAddonTemplate enabled."
  reloaded: "Reloaded with FarmersDelight (reason: {reason})."
  recipes_loaded: "Loaded {count} FarmersDelight recipe(s)."
  food_effects_loaded: "Loaded {count} configured food effect(s)."
  advancements_disabled: "Example advancement tab not registered (reason: {reason})."
  advancements_registration_failed: "Example advancements registration failed."
  config_update_failed: "Could not update {file}, settings were not merged: {error}"
  config_backup_failed: "Failed to back up {file} before rewriting it: {error}"
  config_key_migrated: "Migrated config key '{old}' to '{new}'."
  config_keys_retired: "Removed {count} retired setting(s) from config.yml; they are no longer read: {keys}"
  config_keys_merged: "Added {count} new settings to config.yml."
  example_recipe:
    title: "<gold>Example Recipes"
    list_title: "<gold>Example Recipes"
    detail_title: "<gold>Example Recipe"
    description: "<gray>Cook in a cooking pot."
    prev_page: "<white>Previous"
    next_page: "<white>Next"
    close: "<white>Close"
    back: "<white>Back"
    fill: "<white>Fill ingredients"

